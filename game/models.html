<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#1a1c2a}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script>
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(2, devicePixelRatio||1));
document.body.appendChild(renderer.domElement);
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a2c3e);
scene.add(new THREE.HemisphereLight(0xffffff, 0x222833, 1.2));
var sun=new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(3, 8, 5);
scene.add(sun);
var floor=new THREE.Mesh(new THREE.CircleGeometry(6, 40), new THREE.MeshStandardMaterial({color:0xe7e9ef, roughness:0.8}));
floor.rotation.x=-Math.PI/2;
scene.add(floor);
var camera=new THREE.PerspectiveCamera(30, window.innerWidth/window.innerHeight, 0.05, 50);
camera.position.set(0.2, 1.15, 4.2);
camera.lookAt(0, 0.9, 0);
var loader=new THREE.GLTFLoader();
function place(gltf, x){
  var root=gltf.scene;
  var box=new THREE.Box3().setFromObject(root);
  var size=new THREE.Vector3(); box.getSize(size);
  var center=new THREE.Vector3(); box.getCenter(center);
  console.log('size', size.x.toFixed(2), size.y.toFixed(2), size.z.toFixed(2), 'center', center.x.toFixed(2), center.y.toFixed(2), center.z.toFixed(2));
  root.position.x=x-center.x;
  root.position.y=-box.min.y;
  root.position.z=-center.z;
  scene.add(root);
}
loader.load('models/skater.glb', function(g){ place(g, -0.7); });
loader.load('models/goalie.glb', function(g){ place(g, 0.9); });
function frame(){ renderer.render(scene, camera); requestAnimationFrame(frame); }
frame();
</script>
</body>
</html>
